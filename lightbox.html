<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>MyDict 大图查看</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0a0e0c;
      }
    </style>
  </head>
  <body>
    <!--
      popup 专用的大图查看页：popup 是个 460px 的小窗，词条里的扫描图在弹窗内
      永远放不大（用户实测反馈「图片查看器被限制在词典面板范围内」）。点大图时
      popup 不再就地开遮罩，而是 chrome.tabs.create 打开本页——独立标签页里
      遮罩就是真正的全屏，滚轮缩放/拖动平移/翻页的交互与面板内完全一致
      （同一个 render/lightbox.js）。
    -->
    <script src="popup-boot.js"></script>
    <script type="module" src="lightbox-page.js"></script>
  </body>
</html>
